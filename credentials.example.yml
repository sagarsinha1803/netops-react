# Copy to credentials.yml (which .gitignore already excludes) and fill in.
# Read by the MCP servers in mcp_tools/ only -- never sent to the model.

# ---- unicorn CMDB ------------------------------------------------------------
UNICORN_URLS:
  INDIA: https://unicorn.example.net/api/india/
  PARIS: https://unicorn.example.net/api/paris/
UNICORN_TOKEN:
  INDIA: <token>
  PARIS: <token>

# regions reached through a proxy
PROXIES:
  - protocol: https
    uri: http://proxy.example.net:8080
    login: <user>
    password: <password>

# ---- device SSH, through the region's bastion --------------------------------
# Read by mcp_tools/troubleshoot_agent_mcp.py (execute_query_on_server). Region
# keys are lowercased before lookup.
SSH_JUMPHOST_DETAILS:
  india:
    IP: 10.0.0.1
    USERNAME: <bastion user>
    KEY_PATH: C:\path\to\bastion_key
    PORT: 22
DEVICE_DETAILS_SSH:
  india:
    username: <device user>
    password: <device password>

# ---- Tufin SecureTrack -------------------------------------------------------
TUFIN_URL: https://<SecureTrack_IP>
TUFIN_USER: <api user>
TUFIN_PASSWORD: <password>
# false skips TLS verification entirely, which exposes the Basic-auth header to
# anyone able to intercept the connection. Prefer the path to the CA bundle that
# signed SecureTrack's certificate.
TUFIN_VERIFY_SSL: false

# ---- Archangel alert database (read-only) ------------------------------------
# Read by mcp_tools/alert_mcp.py. The agent only ever runs one SELECT against
# it, so give this account SELECT on public.alert and public.ticket and nothing
# more -- the credentials sit in this file, and least privilege is the only
# thing standing between a mistake and a write.
ARCHANGEL_DB_URL: postgresql+psycopg2://<user>:<password>@<host>:5432/<database>
